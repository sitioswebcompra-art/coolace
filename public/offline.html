<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <title>Sin conexión · CoolAceGest</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; background: #f1f5f9; color: #0f172a; }
      body { display: grid; min-height: 100vh; min-height: 100dvh; margin: 0; place-items: center; padding: 24px; box-sizing: border-box; text-align: center; }
      main { max-width: 28rem; }
      h1 { font-size: 1.5rem; }
      p { color: #475569; line-height: 1.6; }
      button { min-height: 44px; margin-top: 12px; padding: 0 18px; border: 0; border-radius: 8px; background: #2563eb; color: white; font: inherit; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <h1>Sin conexión a Internet</h1>
      <p>La aplicación necesita conexión para consultar o guardar información. Cuando recuperes la conexión, vuelve a intentarlo.</p>
      <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
